<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — Página no encontrada | Grover Choque Villca</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .code {
      font-size: clamp(64px, 15vw, 120px);
      font-weight: 700;
      color: #22c55e;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    h1 {
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      font-weight: 600;
      margin-top: 16px;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 12px;
      max-width: 420px;
    }
    a {
      display: inline-block;
      margin-top: 32px;
      padding: 12px 28px;
      background-color: #22c55e;
      color: #0f172a;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 8px;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }
    a:hover { background-color: #4ade80; }
    a:focus-visible { outline: 2px solid #4ade80; outline-offset: 3px; }
    .name {
      margin-top: 48px;
      font-size: 0.8rem;
      color: #475569;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>La ruta que buscas no existe o fue movida. Puedes volver al portafolio desde aquí.</p>
    <a href="/">Volver al inicio</a>
    <p class="name">Grover Choque Villca — Portafolio</p>
  </main>
</body>
</html>
